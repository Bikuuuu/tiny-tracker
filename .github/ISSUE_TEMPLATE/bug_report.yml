name: Bug report
description: Something in Tiny Tracker doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out anything personal, such as names, email addresses or paths with your user name in them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the flyout
        2. ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic info
      description: In Tiny Tracker, open Settings, choose Copy diagnostic info, and paste it here. It holds versions, counts and settings only.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: Optional. Settings > Open logs folder. Paste only the lines around the problem, and remove app names you'd rather not share.
      render: text
